<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniShop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shop-card">
    <h1>MiniShop</h1>

    <div class="add-form">
      <input type="text" id="productInput" placeholder="Назва товару">
      <button id="addButton">Додати</button>
    </div>

    <ul id="productList"></ul>

    <div class="summary">
      <p>Усього товарів: <span id="total">0</span></p>
      <p>Куплено: <span id="completed">0</span></p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
